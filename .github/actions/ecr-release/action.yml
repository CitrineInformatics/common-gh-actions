name: 'ECR Release'
description: 'Mark a published ECR image as a release in every region and record a GitHub release. Assumes AWS credentials are already configured.'
inputs:
  repositories:
    description: 'Newline- or space-separated ECR repository names, all from the same build'
    required: true
  source-tag:
    description: 'Immutable image tag to release: main-<sha> or v<major.minor>.<n>'
    required: true
  regions:
    description: 'Newline- or space-separated AWS regions; the first is the source of truth'
    required: true
  version:
    description: 'Override the v<major.minor>.<n> version read from the image tags'
    required: false
    default: ''
  github-release:
    description: 'Create the git tag and GitHub release'
    required: false
    default: 'true'
  github-token:
    description: 'Token for the GitHub release; needs contents: write'
    required: false
    default: ${{ github.token }}
outputs:
  release-tag:
    description: 'release-v<version>, or empty when the image has no version'
    value: ${{ steps.release.outputs.release_tag }}
  ordered-tag:
    description: 'release-YYYY.MM.DD.HHMMSS (UTC), which the GitHub release hangs off'
    value: ${{ steps.release.outputs.ordered_tag }}
  short-sha:
    description: 'Short SHA of the commit the image was built from (from its main-<sha> tag)'
    value: ${{ steps.release.outputs.short_sha }}
  digests:
    description: 'JSON object of repository to released image digest'
    value: ${{ steps.release.outputs.digests }}
runs:
  using: "composite"
  steps:
    # This action is self-contained: it installs its own Python and
    # dependencies, and works through the ECR and GitHub APIs, so it
    # needs no checkout.
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install boto3
      run: pip install boto3
      shell: bash
    - name: Preflight the images in every region
      id: release
      # Inputs travel as env vars, so multi-line lists and odd characters are safe.
      env:
        REPOSITORIES: ${{ inputs.repositories }}
        SOURCE_TAG: ${{ inputs.source-tag }}
        REGIONS: ${{ inputs.regions }}
        VERSION: ${{ inputs.version }}
        NOTES_FILE: ${{ runner.temp }}/ecr-release-notes.md
        PLAN_FILE: ${{ runner.temp }}/ecr-release-plan.json
        RELEASE_PHASE: plan
      run: python "${{ github.action_path }}/ecr_release.py"
      shell: bash
    - name: Preflight the GitHub release
      id: github
      if: inputs.github-release == 'true'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        ORDERED_TAG: ${{ steps.release.outputs.ordered_tag }}
      run: bash "${{ github.action_path }}/github_release.sh" preflight
      shell: bash
    - name: Tag the images in every region
      env:
        PLAN_FILE: ${{ runner.temp }}/ecr-release-plan.json
        RELEASE_PHASE: apply
      run: python "${{ github.action_path }}/ecr_release.py"
      shell: bash
    - name: Record the GitHub release
      if: inputs.github-release == 'true'
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        SHA: ${{ steps.github.outputs.sha }}
        RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        ORDERED_TAG: ${{ steps.release.outputs.ordered_tag }}
        TITLE: ${{ steps.release.outputs.title }}
        NOTES_FILE: ${{ runner.temp }}/ecr-release-notes.md
      run: bash "${{ github.action_path }}/github_release.sh" record
      shell: bash
